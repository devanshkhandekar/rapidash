[package]
name = "rapidash"
version = "0.1.0"
edition = "2021"
description = "A modern Linux system monitor and memory management utility"
[features]
default = []
ubuntu24 = ["gtk4/v4_14", "libadwaita/v1_5"]

[dependencies]
# Universal baseline for both Ubuntu 22.04 (GTK 4.6 / Adw 1.1) and Ubuntu 24.04 (GTK 4.14 / Adw 1.5)
gtk4 = { version = "0.9", features = ["v4_6"] }
libadwaita = { version = "0.7", features = ["v1_1"] }

# Async runtime, WebSocket server, and lock-free UI channels
tokio = { version = "1.40", features = ["rt-multi-thread", "macros", "time", "net", "sync"] }
tokio-tungstenite = "0.30"
futures-util = "0.3"
async-channel = "2.3"

# Low-level POSIX signals & UID lookup
libc = "0.2"

# JSON Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
